      47.00% { transform: translateX(0); opacity: 1; }
      47.01%,100% { transform: translateX(0); opacity: 0; }
    }
    #c0 rect { transform-origin: 140.4px 0; animation: reveal0 8s steps(5) infinite; }
    #k0 { animation: caret0 8s steps(5) infinite; }
    @keyframes reveal1 {
      0%,50.00% { transform: scaleX(0); }
      62.00%,90.00% { transform: scaleX(1); }
      97.00%,100% { transform: scaleX(0); }
    }
