      97.00% { transform: translateX(0); opacity: 1; }
      97.01%,100% { transform: translateX(0); opacity: 0; }
    }
    #c1 rect { transform-origin: 140.4px 0; animation: reveal1 8s steps(8) infinite; }
    #k1 { animation: caret1 8s steps(8) infinite; }</style>
  <text x="0" y="40" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="500">Hey, I'm </text>
