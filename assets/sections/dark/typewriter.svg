  <text x="140.4" y="40" clip-path="url(#c0)" fill="#2F81F7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="700">Wrack</text>
  <rect id="k0" x="140.4" y="17" width="2.5" height="28" fill="#2F81F7"/>
  <clipPath id="c1"><rect x="140.4" y="0" width="124.8" height="60"/></clipPath>
  <text x="140.4" y="40" clip-path="url(#c1)" fill="#2F81F7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="700">Himanshu</text>
  <rect id="k1" x="140.4" y="17" width="2.5" height="28" fill="#2F81F7"/>
