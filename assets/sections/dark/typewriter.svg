<svg xmlns="http://www.w3.org/2000/svg" width="520" height="60" viewBox="0 0 520 60" role="img" aria-label="Hey, I'm Wrack — Himanshu Lal">
  <title>Hey, I'm Wrack — Himanshu Lal</title>
  <style>
    @keyframes reveal0 {
      0%,0.00% { transform: scaleX(0); }
      12.00%,40.00% { transform: scaleX(1); }
      47.00%,100% { transform: scaleX(0); }
    }
    @keyframes caret0 {
      0%,0.00% { transform: translateX(0); opacity: 1; }
