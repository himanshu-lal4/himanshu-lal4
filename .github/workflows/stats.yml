name: Refresh stat badges

on:
  schedule:
    - cron: '17 4 * * *'   # daily, 04:17 UTC
  workflow_dispatch:
  push:
    paths:
      - 'scripts/gen_stat_badges.py'
      - '.github/workflows/stats.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate badges
        run: python scripts/gen_stat_badges.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain assets/badges)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/badges
            git commit -m "Refresh stat badges"
            git pull --rebase --autostash origin main
            git push
          else
            echo "no change"
          fi
