name: Refresh stat badges, streak card and stat cards

on:
  schedule:
    # Twice daily. The streak service failed at the 04:5x slot on two of
    # three consecutive runs while an off-schedule 20:56 run succeeded, so a
    # second window means a transient outage heals in 12h, not 24h.
    - cron: '17 4 * * *'    # 04:17 UTC
    - cron: '43 16 * * *'   # 16:43 UTC
  workflow_dispatch:
  push:
    paths:
      - 'scripts/gen_stat_badges.py'
      - 'scripts/mirror_cards.py'
      - '.github/workflows/stats.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate badges
        run: python scripts/gen_stat_badges.py

      - name: Mirror the stat cards
        # The summary-card, activity-graph and streak services share one GitHub API
        # token pool across every profile that embeds them. When it runs dry
        # they answer HTTP 200 with a placeholder reading "rate limited" or
        # "Failed to retrieve contributions", and tell camo to cache it for up
        # to four hours - which is how a transient blip ended up pinned to the
        # profile as a red ERROR block. Mirroring here means a bad fetch costs
        # nothing: the previous copy stays. Crucially it validates the body
        # rather than the status code - the placeholders come back as valid
        # SVGs with HTTP 200, which is how the streak card's old `grep -q
        # "<svg"` check let an error page be committed twice. The script also
        # inlines the CSS these cards need, since GitHub strips <style> from
        # repo-served SVGs.
        run: python scripts/mirror_cards.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain assets/badges assets/streak-card.svg assets/cards)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/badges assets/streak-card.svg assets/cards
            git commit -m "Refresh stat badges, streak card and stat cards"
            git pull --rebase --autostash origin main
            git push
          else
            echo "no change"
          fi
